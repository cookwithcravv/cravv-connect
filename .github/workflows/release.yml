# Builds the release archives when a v* tag is pushed and publishes them with
# SHA256SUMS on the GitHub release. cravv-connect needs cgo for PAM, so each
# platform builds on a native runner; cravv-relay and cravv-conformance are
# pure Go (CGO_ENABLED=0). scripts/install.sh downloads these archives.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    strategy:
      # Every platform reports its own result; publish still needs all four.
      fail-fast: false
      matrix:
        include:
          - { runner: macos-14, goos: darwin, goarch: arm64 }
          - { runner: macos-15-intel, goos: darwin, goarch: amd64 }
          # cravv-connect links glibc through cgo and needs the glibc it was
          # built with or newer: Ubuntu 22.04 keeps that at 2.35.
          - { runner: ubuntu-22.04, goos: linux, goarch: amd64 }
          - { runner: ubuntu-22.04-arm, goos: linux, goarch: arm64 }
    runs-on: ${{ matrix.runner }}
    env:
      # github.com/msteinert/pam compiles with -std=c99, which hides the GNU
      # extension RTLD_NEXT on Ubuntu 22.04's glibc headers unless _GNU_SOURCE
      # is defined. The flag is harmless on macOS. "-O2 -g" is Go's default.
      CGO_CFLAGS: -O2 -g -D_GNU_SOURCE
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install the PAM headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpam0g-dev
      - name: Check the runner builds for its own platform
        run: test "$(go env GOOS)/$(go env GOARCH)" = "${{ matrix.goos }}/${{ matrix.goarch }}"
      - name: Test
        run: go test ./... -count=1
      - name: Build the archive
        env:
          TAG: ${{ github.ref_name }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -eu
          version="${TAG#v}"
          name="cravv-connect_${version}_${GOOS}_${GOARCH}"
          mkdir -p "dist/$name"
          CGO_ENABLED=1 go build -trimpath -ldflags "-s -w -X github.com/cookwithcravv/cravv-connect/internal/cli.Version=${TAG}" \
            -o "dist/$name/cravv-connect" ./cmd/cravv-connect
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o "dist/$name/cravv-relay" ./cmd/cravv-relay
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o "dist/$name/cravv-conformance" ./cmd/cravv-conformance
          cp README.md LICENSE THIRD_PARTY_LICENSES "dist/$name/"
          "dist/$name/cravv-connect" version | grep -F "cravv-connect ${TAG} (${GOOS}/${GOARCH})"
          if [ "$GOOS" = linux ]; then
            # The README promises glibc 2.35: fail if a newer symbol slipped in.
            need="$(objdump -T "dist/$name/cravv-connect" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -n 1)"
            echo "cravv-connect needs glibc $need"
            test "$(printf '%s\n' "$need" 2.35 | sort -V | tail -n 1)" = 2.35
          fi
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cravv-connect-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # Build provenance: an OIDC token to sign with, and the attestation store.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          set -eu
          test "$(ls *.tar.gz | wc -l)" -eq 4
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS
      # Signed provenance for each archive: `gh attestation verify <archive>
      # --repo <owner>/<repo>` checks it came from this workflow.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # A tag with a suffix (v1.2.0-rc.1) is a prerelease, which GitHub never
        # marks as latest, so install.sh keeps installing the last real release.
        run: |
          set -eu
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          gh release create "$TAG" dist/*.tar.gz dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag $pre
