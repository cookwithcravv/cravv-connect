name = "cravv-relay"
main = "src/index.ts"
compatibility_date = "2026-08-01"

[[durable_objects.bindings]]
name = "MAILBOX"
class_name = "Mailbox"

[[durable_objects.bindings]]
name = "REGISTRY"
class_name = "Registry"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "BLOBMETA"
class_name = "BlobMeta"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Mailbox", "Registry"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Room", "BlobMeta"]

[[r2_buckets]]
binding = "BLOBS"
bucket_name = "cravv-relay-blobs"

# Per-IP limit on connects, pair joins and blob requests (Workers Rate Limiting binding).
[[ratelimits]]
name = "IP_LIMITER"
namespace_id = "1001"
simple = { limit = 600, period = 60 }

# ADMIN_TOKEN is a secret: `npx wrangler secret put ADMIN_TOKEN` (production)
# or a line in .dev.vars (local `wrangler dev`). It is never stored in this file.
#
# PUBLIC_ORIGIN is the origin clients sign during auth (relay-v1 section 1). scripts/deploy.sh
# passes it on every deploy (--var PUBLIC_ORIGIN:https://cravv-relay.<subdomain>.workers.dev),
# so deploy with the script. If unset, the relay falls back to the origin of the request URL.
